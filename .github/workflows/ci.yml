name: CI

on:
  push:
  pull_request:

jobs:
  swift:
    # Xcode 27 (Swift 6.4): its default build system, Swift Build, compiles MLX's .metal kernels into
    # default.metallib. Swift 6.2's native build system skips them, and its Swift Build preview does not
    # link this package (2026-11-22, CI runs 2-4).
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          swift --version 2>&1 | python3 -c '
          import re, sys
          m = re.search(r"Swift version ([0-9]+)\.([0-9]+)", sys.stdin.read())
          if not m or (int(m[1]), int(m[2])) < (6, 4): sys.exit("Swift 6.4 or later (Xcode 27) is required to build the Metal kernels")'

      # MLX's kernels need the Metal toolchain, a separate component since Xcode 26.
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-v4-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-v4-${{ runner.os }}-

      # The tests about meaning load the real memory embedding model (Qwen3-Embedding-0.6B, ~1.2 GB).
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: huggingface-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  bridge:
    runs-on: xcode-27
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # For the real Opus round trip (the test is skipped without it); no Discord connection is made.
      - name: Install libopus
        run: brew install opus
      - name: Test
        run: uv run --frozen pytest -q
