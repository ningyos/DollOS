[project]
name = "dollcore"
version = "0.1.0"
description = "DollOS core demo: single-consumer event loop, one timeline, work lines, external jobs"
requires-python = ">=3.13,<3.14"
dependencies = ["httpx>=0.27"]

[project.scripts]
dollcore = "dollcore.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dollcore"]
