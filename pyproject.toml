[project]
name = "dollos"
version = "0.1.0"
description = "DollOS — Python brain: event loop, Instinct, Memory, Conversation Engine"
requires-python = ">=3.13"
dependencies = [
    "aiortc>=1.9",
    "httpx>=0.27",
    "huggingface-hub>=0.24.0",
    "jinja2>=3.1",
    "luxtts-onnx",
    "memsearch[onnx]>=0.1",
    "onnxruntime>=1.17,<1.25",
    "pydantic>=2.6",
    "scipy>=1.13",
    "sherpa-onnx>=1.10.0",
    "structlog>=24.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
# `uv sync --extra gpu` enables GPU TTS via onnxruntime-gpu + cuDNN.
# sherpa-onnx (ASR) PyPI wheel is CPU-only — for ASR GPU you'd need a
# custom build with -DSHERPA_ONNX_ENABLE_GPU=ON, not addressed here.
# Note: onnxruntime-gpu replaces onnxruntime in site-packages; if you
# install [gpu] you'll also need LD_LIBRARY_PATH pointing at the
# nvidia/cudnn/lib + nvidia/cublas/lib + nvidia/cuda_runtime/lib +
# nvidia/cufft/lib + nvidia/cuda_nvrtc/lib + nvidia/nvjitlink/lib dirs
# from your venv. See docs for the helper export.
fish = [
    "fish-tts @ git+https://github.com/ningyos/fish-tts",
    "descript-audio-codec",
    "descript-audiotools @ git+https://github.com/descriptinc/audiotools",
    # pycryptodomex unblocks yt-dlp's Cryptodome passthrough that otherwise
    # makes torch.compile/inductor try to import a sentinel `no_Cryptodome`.
    "pycryptodomex",
    # fish-tts streaming deadlocks on torch >= 2.12 (triton 3.7 + inductor
    # streaming graph changes). 2.10 is the version fish-tts is tested against.
    "torch>=2.10,<2.12",
    "torchaudio>=2.10,<2.12",
]
piper = [
    "piper-tts>=1.2",
]
openai-tts = [
    "httpx>=0.27",
]
qwen3 = [
    "qwen-tts>=0.1",
    # Reuse the fish stack's torch pin to keep one consistent CUDA env.
    "torch>=2.10,<2.12",
    "torchaudio>=2.10,<2.12",
]
eval = [
    "speechbrain>=1.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "torch>=2.10,<2.12",
    "torchaudio>=2.10,<2.12",
]
gpu = [
    "onnxruntime-gpu>=1.24,<1.25",
    "nvidia-cudnn-cu12>=9.5",
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cuda-runtime-cu12>=12.4",
    "nvidia-cufft-cu12>=11.2",
    "nvidia-cuda-nvrtc-cu12>=12.4",
]

[project.scripts]
dollos = "dollos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dollos"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "yt-dlp>=2026.3.17",
]

[tool.uv]
find-links = ["https://k2-fsa.github.io/icefall/piper_phonemize.html"]

[tool.uv.sources]
luxtts-onnx = { git = "https://github.com/ningyos/luxtts-onnx.git" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "voice_integration: tests that load real ONNX models (slow, downloads on first run)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
