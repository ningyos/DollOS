[project]
name = "dollos"
version = "0.1.0"
description = "DollOS — Python brain: event loop, Instinct, Memory, Conversation Engine"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "memsearch[onnx]>=0.1",
    "pydantic>=2.6",
    "structlog>=24.0",
    "websockets>=12.0",
]

[project.scripts]
dollos = "dollos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dollos"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
