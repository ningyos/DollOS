[project]
name = "dollos"
version = "0.1.0"
description = "DollOS — Python brain: event loop, Instinct, Memory, Conversation Engine"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "huggingface-hub>=0.24.0",
    "jinja2>=3.1",
    "luxtts-onnx",
    "memsearch[onnx]>=0.1",
    "onnxruntime>=1.17,<1.25",
    "pydantic>=2.6",
    "sherpa-onnx>=1.10.0",
    "structlog>=24.0",
    "websockets>=12.0",
]

[project.scripts]
dollos = "dollos.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dollos"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.uv]
find-links = ["https://k2-fsa.github.io/icefall/piper_phonemize.html"]

[tool.uv.sources]
luxtts-onnx = { path = "../luxtts-onnx", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "voice_integration: tests that load real ONNX models (slow, downloads on first run)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
