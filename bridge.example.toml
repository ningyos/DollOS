# DollOS discord-bridge config — copy to `bridge.toml` and fill in.
#
#   cp bridge.example.toml bridge.toml
#   # edit the values below, then (from the repo root):
#   uv run dollosctl install --daemon-config config.toml --bridge-config bridge.toml --data-root data
#   uv run dollosctl start
#
# This file lives ON-DEVICE and holds your bot token — it is gitignored,
# NEVER commit it. The systemd unit references this file's PATH only; the
# token never enters the unit file. See docs/dollosctl-smoke.md for the full
# dogfood checklist.

[discord]

# REQUIRED — your Discord bot token.
# Get one at https://discord.com/developers/applications → your app → Bot →
# Reset Token. The bot needs the "Message Content Intent" enabled (same page),
# and must be invited to your server with permission to read + send messages
# in the channels you list below.
token = "PASTE_YOUR_BOT_TOKEN_HERE"

# REQUIRED — your own Discord user ID (numeric, as a string is fine).
# This is how Doll knows which messages are from you (owner): owner DMs/mentions
# preempt her + upgrade to UserSpoke-equivalent (cancel/energy). To get it:
# Discord → User Settings → Advanced → enable Developer Mode, then right-click
# your name → Copy User ID.
owner_discord_id = "000000000000000000"

# OPTIONAL — default true (2026-07-06 spec §4.2, Part B / B2). When true,
# the bridge only forwards messages from guilds YOU (the owner) have
# joined, plus your own DMs — every other guild's messages and every
# stranger DM are dropped before Doll ever sees them. Set to false to go
# back to forward-all (every message in every guild the bot can read, plus
# every DM from anyone) — only do this if the bot is private/invite-only
# and you trust everyone who can reach it. START with this left at its
# default (true) while you dogfood; you've confirmed P1e external-safety
# is merged + tested, but verify live before loosening it.
# owner_guild_only = true

# OPTIONAL — default [] (2026-07-06 spec §4.3, Part B / B3, D5(ii)). Channel
# IDs (right-click a channel → Copy Channel ID, Developer Mode on) whose
# recent history is replayed on every reconnect, so a brief daemon/bridge
# outage doesn't lose messages posted while disconnected. Deliberately
# DECOUPLED from owner_guild_only above: backfill re-runs on EVERY
# reconnect (the bridge retries every ~5s while down), so scoping it to
# every owner-guild channel would multiply into N channels x fetch-history
# REST calls per retry — a real rate-limit risk. Leave empty (no backfill)
# unless you specifically want reconnect-gap history for a small,
# deliberately curated set of channels — live messages resume immediately
# either way, with or without this.
# backfill_channels = [
#     "111111111111111111",   # #test-channel
# ]

# Name-wake (who Doll answers to by name), always-wake channels, and the old
# channel_allowlist gate are NOT configured here anymore (2026-07-06
# self-learned-aliases + owner-guild-only spec, Part A A5 + Part B B3):
# channel_allowlist never actually gated forwarding — the bridge forwards
# every message (subject only to the self-filter and owner_guild_only
# above) and the DAEMON's AttentionGate decides admission. If you want an
# admin-set floor of names/always-wake channels, see `[attention]` in the
# daemon's config.example.toml; a character pack's own `[meta] name` /
# `[meta] aliases` is the permanent per-character seed, and Doll also
# learns nicknames herself over time.
