# DollOS mcp-server config — copy to `mcp.toml` and fill in.
#
#   cp mcp.example.toml mcp.toml
#   # then point config.toml's [mcp] block at it:
#   #   [mcp]
#   #   enabled = true
#   #   config  = "mcp.toml"
#
# This file lives ON-DEVICE — it is gitignored, NEVER commit it. The daemon
# (not the systemd unit) reads this file's PATH from its own config's
# [mcp].config and spawns dollos-mcp as a supervised child subprocess
# (2026-07-06 ServiceSupervisor, the 2nd registered service).

[server]

# Loopback-only (spec §E) — the connector FAIL-CLOSED validates this: any
# non-loopback value (e.g. "0.0.0.0") makes it refuse to start. For remote
# access use an SSH tunnel / authenticated reverse proxy, never a rebindable
# socket. Allowed: "127.0.0.1", "::1", "localhost".
bind_host = "127.0.0.1"

# Port the FastMCP streamable-HTTP server binds. External MCP clients connect
# to http://127.0.0.1:<bind_port>/mcp.
bind_port = 9877

# ----------------------------------------------------------------------
# Debug mode (P2, optional). Leave BOTH empty to keep the endpoint
# peer-only — no introspection, no reliability nudge; the get_state /
# get_recent tools stay permanently gated (empty debug_secret never
# authenticates) and talk() never stamps debug_reliable.
#
# OWNER-SENSITIVE: this file is gitignored (never commit real values —
# copy from mcp.example.toml, then edit mcp.toml in place).
# ----------------------------------------------------------------------

# A shared secret a debug MCP client presents via authenticate(secret).
# On a correct match it unlocks get_state()/get_recent() introspection for
# that connection AND a best-effort "give a substantive reply" nudge on
# talk() (still no new tools, still not owner — spec §C.1/§C.2).
debug_secret = ""

# MUST equal config.toml's [mcp].query_token — this is a SEPARATE secret
# from debug_secret, stamped onto every get_state/get_recent IPC query so
# the daemon (which has no per-connection auth on its IPC server) can
# fail-closed reject queries that don't carry it. A mismatch (or leaving
# either side empty) makes get_state/get_recent raise, even after a
# successful authenticate(secret).
query_token = ""
