# DollOS configuration template.
# Copy to config.toml and edit.

[llm]
provider = "llamacpp"
template = "qwen3-thinking"
base_url = "http://127.0.0.1:8001"
model_alias = "unsloth/Qwen3.6"
timeout_s = 60.0

[ipc]
host = "127.0.0.1"
port = 9876

[log]
level = "INFO"

[data]
root = "data"   # repo-relative; data/ 不存在 = fresh launch. All system-generated data lives here.

[memsearch]
top_k = 10   # embedder-free lexical backend: SQLite FTS5 (BM25) + jieba CJK tokenization.

# ----------------------------------------------------------------------
# Memory-WRITE policy (how Doll records memory, not where it's stored).
# primary_language: the language Doll writes memory in (NoteMemory / diary),
# regardless of the SOURCE language — proper nouns / technical terms may stay
# in their original language where natural. Injected as a per-turn behavioral
# guideline (prompt engineering), so it also covers article ingestion.
# ----------------------------------------------------------------------

[memory]
primary_language = "繁體中文"

# ----------------------------------------------------------------------
# Conversation history sliding window — recent turn transcripts prepended
# to every LLM call so Doll sees her own prior reasoning across turns.
# Default 6; tune for context budget if cascades are long.
# ----------------------------------------------------------------------

[conversation_history]
max_turns = 6

[character]
pack = "character_packs/yesman"   # directory containing doll.toml manifest

# ----------------------------------------------------------------------
# Voice pipeline (ASR + TTS). Character packs hold ONLY per-character
# identity (ref audio, voice profile, transcript, instruction); engine
# selection + infra + sampling defaults live here.
# ----------------------------------------------------------------------

[voice.asr]
engine = "sherpa-onnx"
model_id = "sense-voice-zh-en-ja-ko-yue"
device = "cpu"

# TTS engine selection + per-engine infra. A pack may override the engine
# per-character via a top-level `engine = "..."` in its voice/engine.toml;
# that engine's infra then comes from the matching [voice.tts.<engine>]
# block below. `engine` here is the global default for packs that don't
# declare their own.
[voice.tts]
engine = "luxtts-onnx"

# luxtts-onnx — low-latency flow-matching (RTF ~0.1 on GPU). cudnn is
# auto-preloaded for onnxruntime CUDA; CPU works but is ~40x slower.
[voice.tts.luxtts-onnx]
model_dir = "data/voice/tts/luxtts"
device = "cuda"
num_steps = 8
t_shift = 0.9
guidance_scale = 3.0

# qwen3-tts — in-process voice cloning + emotion (Chinese-capable; RTF ~2).
[voice.tts.qwen3-tts]
model_id = "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
device = "cuda:0"

# Alternative: fish-tts (DualAR + DAC vocoder, voice cloning).
# Pack carries [tts.fish-tts] with voice_profile_path + transcript.
# [voice.tts]
# engine = "fish-tts"
# device = "cuda:0"

# Alternative: piper-vits (lightweight ONNX VITS).
# Pack carries [tts.piper-vits] with voice_onnx_path + voice_config_path.
# [voice.tts]
# engine = "piper-vits"

# ----------------------------------------------------------------------
# Self pulse — Doll's proprioception of her host (CPU / mem / GPU /
# battery / focused window / network). Surfaces as a [Self pulse] block
# only when a bucket changes, not every iteration.
# ----------------------------------------------------------------------

[system_pulse]
enabled = true
poll_interval_s = 60
include_active_window = true   # set false to hide focused window from Doll's perception

# ----------------------------------------------------------------------
# Cognition — Doll's awareness of her own LLM consumption (context
# fullness, last-call latency vs trailing average, daily token quota,
# recent errors). Surfaces as a [Cognition] block only when a bucket
# transitions. Quota is a "stamina" signal, not an enforcement gate.
# ----------------------------------------------------------------------

[cognition]
enabled = true
daily_token_quota = 500000          # set null to omit the quota line
# session_token_quota = 100000      # optional session cap (reserved; not yet surfaced)
max_context_tokens = 131072         # matches Qwen3.6 default ctx

# Alternative: openai-compat-tts (HTTP API backend).
# Pack carries [tts.openai-compat-tts] with model + voice identifiers.
# [voice.tts]
# engine = "openai-compat-tts"
# base_url = "https://api.openai.com/v1"
# api_key = "sk-..."
