# DollOS configuration template.
# Copy to config.toml and edit.

[llm]
provider = "llamacpp"
template = "qwen3-thinking"
base_url = "http://127.0.0.1:8001"
model_alias = "unsloth/Qwen3.6"
timeout_s = 60.0

[ipc]
host = "127.0.0.1"
port = 9876

[log]
level = "INFO"

[memory]
db_path = "~/.local/share/dollos/memory.db"

[embedder]
backend = "llamacpp"
base_url = "http://127.0.0.1:8002"   # typically a separate llama-server started with --embedding
model_id = "bge-base-en-v1.5"
timeout_s = 30.0

[character]
profile_path = "experiments/test_character.jinja"   # development character profile (Gura mock)
