# DollOS configuration template.
# Copy to config.toml and edit.

[llm]
provider = "llamacpp"
template = "qwen3-thinking"
base_url = "http://127.0.0.1:8001"
model_alias = "unsloth/Qwen3.6"
timeout_s = 60.0
max_concurrency = 2   # concurrent LLM generations; set to your llama-server --parallel (cloud APIs can raise)

[ipc]
host = "127.0.0.1"
port = 9876

# ----------------------------------------------------------------------
# Discord bridge internalization (2026-07-06 spec). The daemon spawns and
# supervises the bridge as a child subprocess via the generic
# ServiceSupervisor (PDEATHSIG anti-orphan, SIGINT graceful stop,
# crash-loop cap + BridgeDown perception on giving up) — it is no longer
# a separate systemd unit. enabled=false (default) = bridge never starts,
# zero overhead. Setting enabled=true requires `config` to point at a
# separate bridge.toml holding the actual [discord] token/owner table
# (see bridge.example.toml) — keep that file out of git, same as this
# one once copied to config.toml.
# ----------------------------------------------------------------------

[bridge]
enabled = false
config  = "bridge.toml"

# ----------------------------------------------------------------------
# MCP server (2026-07-07 spec, P1 peer mode). Lets an external AI (e.g.
# Claude Code) talk to Doll as a peer over MCP. Same internalization
# discipline as the bridge above: the daemon spawns dollos-mcp as a
# supervised child subprocess (ServiceSupervisor's 2nd registered service)
# only when enabled=true AND `config` points at an existing mcp.toml (see
# mcp.example.toml) holding the actual [server] bind_host/bind_port.
# enabled=false (default) = mcp-server never starts, zero overhead.
# ----------------------------------------------------------------------

[mcp]
enabled = false
config  = "mcp.toml"
# query_token = "change-me"   # enables the debug read-query surface (get_state/get_recent, P2 spec §C.3).
                              # MUST match mcp.toml's [server].query_token exactly. Empty/unset (default)
                              # = query surface disabled, fail-closed — the daemon rejects every
                              # QueryState/QueryRecent regardless of what token a caller sends.

[log]
level = "INFO"

[data]
root = "data"   # repo-relative; data/ 不存在 = fresh launch. All system-generated data lives here.

[memsearch]
top_k = 10   # embedder-free lexical backend: SQLite FTS5 (BM25) + jieba CJK tokenization.

# ----------------------------------------------------------------------
# Memory-WRITE policy (how Doll records memory, not where it's stored).
# primary_language: the language Doll writes memory in (NoteMemory / diary),
# regardless of the SOURCE language — proper nouns / technical terms may stay
# in their original language where natural. Injected as a per-turn behavioral
# guideline (prompt engineering), so it also covers article ingestion.
# ----------------------------------------------------------------------

[memory]
primary_language = "繁體中文"

# ----------------------------------------------------------------------
# Conversation history sliding window — recent turn transcripts prepended
# to every LLM call so Doll sees her own prior reasoning across turns.
# Default 6; tune for context budget if cascades are long.
# ----------------------------------------------------------------------

[conversation_history]
max_turns = 6

[character]
pack = "character_packs/yesman"   # directory containing doll.toml manifest

# ----------------------------------------------------------------------
# Attention (name-wake). Doll primarily learns which names/nicknames she
# answers to HERSELF (self-learned aliases — owner-present `LearnName` calls
# write to data/memory/name_aliases.json; see the 2026-07-06
# self-learned-aliases spec). The two permanent, un-prunable seeds are the
# character pack's `[meta] name` and optional `[meta] aliases` (e.g. Gura's
# pack seeds "古拉" alongside "Gura").
#
# `name_aliases` / `always_wake_channels` below are an OPTIONAL admin static
# floor on top of that — leave this section absent entirely unless you want
# to hard-pin extra names or channels regardless of what Doll has learned.
# All entries, seed or learned, pass the SAME mechanical guard (min length,
# denylist) before they can wake her.
# ----------------------------------------------------------------------

# [attention]
# name_aliases = []           # optional admin floor, e.g. ["小鯊"]
# always_wake_channels = []   # optional admin floor, channel IDs

# ----------------------------------------------------------------------
# Voice pipeline (ASR + TTS). Character packs hold ONLY per-character
# identity (ref audio, voice profile, transcript, instruction); engine
# selection + infra + sampling defaults live here.
# ----------------------------------------------------------------------

[voice.asr]
engine = "sherpa-onnx"
model_id = "sense-voice-zh-en-ja-ko-yue"
device = "cpu"

# TTS engine selection + per-engine infra. A pack may override the engine
# per-character via a top-level `engine = "..."` in its voice/engine.toml;
# that engine's infra then comes from the matching [voice.tts.<engine>]
# block below. `engine` here is the global default for packs that don't
# declare their own.
[voice.tts]
engine = "luxtts-onnx"

# luxtts-onnx — low-latency flow-matching (RTF ~0.1 on GPU). cudnn is
# auto-preloaded for onnxruntime CUDA; CPU works but is ~40x slower.
[voice.tts.luxtts-onnx]
model_dir = "data/voice/tts/luxtts"
device = "cuda"
num_steps = 8
t_shift = 0.9
guidance_scale = 3.0

# qwen3-tts — in-process voice cloning + emotion (Chinese-capable; RTF ~2).
[voice.tts.qwen3-tts]
model_id = "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
device = "cuda:0"

# Alternative: fish-tts (DualAR + DAC vocoder, voice cloning).
# Pack carries [tts.fish-tts] with voice_profile_path + transcript.
# [voice.tts]
# engine = "fish-tts"
# device = "cuda:0"

# Alternative: piper-vits (lightweight ONNX VITS).
# Pack carries [tts.piper-vits] with voice_onnx_path + voice_config_path.
# [voice.tts]
# engine = "piper-vits"

# ----------------------------------------------------------------------
# Energy — B3 energy system (active-consumes, idle-restores, prompt-
# injects), extended by the 代謝 vital model (2026-07-10 spec) into a
# token-driven drain. cost_per_turn is now ONLY the D1 flat_legacy degrade
# (both prompt and completion token counts missing for the whole turn);
# token_per_energy_unit is the primary formula's divisor. The thermal
# multipliers make a hot GPU cost MORE ATP for the same token effort,
# reusing system_pulse's cool/warm/hot GPU buckets (55/75°C). All of
# token_per_energy_unit/thermal_multiplier_* are smoke-tuned (spec §7 D4).
# ----------------------------------------------------------------------

[energy]
enabled = true
cost_per_turn = 0.05           # D1 flat_legacy degrade only (token counts missing all turn)
restore_per_tick = 0.05
idle_threshold_s = 600
restore_debounce_s = 300
token_per_energy_unit = 2000.0   # primary drain formula: (completion + 0.25*prompt) / this
thermal_multiplier_warm = 1.15   # GPU 55-75°C
thermal_multiplier_hot = 1.4     # GPU >75°C

# ----------------------------------------------------------------------
# Self pulse — Doll's proprioception of her host (CPU / mem / GPU /
# battery / focused window / network). Surfaces as a [Self pulse] block
# only when a bucket changes, not every iteration.
# ----------------------------------------------------------------------

[system_pulse]
enabled = true
poll_interval_s = 60
include_active_window = true   # set false to hide focused window from Doll's perception

# ----------------------------------------------------------------------
# Cognition — Doll's awareness of her own LLM consumption (context
# fullness, last-call latency vs trailing average, daily token quota,
# recent errors). Surfaces as a [Cognition] block only when a bucket
# transitions. Quota is a "stamina" signal, not an enforcement gate.
# ----------------------------------------------------------------------

[cognition]
enabled = true
daily_token_quota = 500000          # set null to omit the quota line
# session_token_quota = 100000      # optional session cap (reserved; not yet surfaced)
max_context_tokens = 131072         # matches Qwen3.6 default ctx

# Alternative: openai-compat-tts (HTTP API backend).
# Pack carries [tts.openai-compat-tts] with model + voice identifiers.
# [voice.tts]
# engine = "openai-compat-tts"
# base_url = "https://api.openai.com/v1"
# api_key = "sk-..."
