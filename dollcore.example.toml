[llm]
base_url = "http://192.0.2.11:8080"
model = "qwen3.8-flash-next-iq3_s"
reasoning_effort = "high"      # Strata maps this to the model
timeout_s = 300.0
max_tokens = 4096

[decision]
base_url = "http://127.0.0.1:1976" # `fm serve --port 1976` (started by the owner)
model = "system"
timeout_s = 30.0

[core]
data_dir = "data"
pack = "character_packs/doll2/doll.toml"
max_internal_passes = 4
max_open_lines = 5
line_daily_steps = 20
idle_first_s = 300.0
idle_every_s = 600.0
shell_timeout_s = 600.0
approve_external = true       # every external action waits for /approve
approval_timeout_s = 1800.0   # unanswered requests are denied after this
job_result_inline_chars = 4000
timeline_window_messages = 200
