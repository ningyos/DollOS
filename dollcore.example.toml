# 主人平常睡覺的時間（2026-11-16，主人選 A：告訴她，不擋她；Calendar.swift、dolldocs/calendar.md）：行事曆上每天一段「主人睡覺」，開始和結束都不給回合；現在在這段裡，【狀況】、走神和系統維護的通知會多一句「主人現在應該在睡」。她要不要找他還是她決定，discord.dm 不擋
enabled = true            # 關掉＝沒有「主人睡覺」、沒有那句。理由：實驗 runner 和不是在測這個的測試用；她自己的程序開著
start = "00:00"           # 行事曆沒有「主人睡覺」時建的開始時間（每天）。理由：主人給的數字（2026-11-16）；他晚上常聊到午夜左右；不對就在 dashboard 改那一項（可以只改一天）
end = "08:00"             # 結束時間；不晚於 start 就是隔天的（23:00–07:00 到隔天 07:00），不能和 start 一樣。理由：同上

[drives]
# 她的掛念和三個訊號（m6-drives，2026-11-15，主人設計；Concerns.swift、Signals.swift、dolldocs/drives.md）。值都在 0–1；事件讓訊號跳一下，事件之間各自用自己的半衰期回到 rest。每次變化都記原因（signals.json、dashboard）。她看不到數字：超出範圍時【狀況】多一句感覺，閒著時讓一件相關的掛念冒出來（【走神】，一次跨出只冒一次）。主人找她沒有上限，頻率只看訊號，所以初始值保守。睡意 2026-11-16 拿掉了（睡覺改成系統維護）；舊的 signals.json 裡的睡意開機時丟掉，log 會寫
# 數字用模擬的一週調（experiments/m6-drives/week.txt，Tests/DollCoreTests/M6DrivesWeek.swift）；那是有睡覺時調的：睡著時壓力減半、親近釘住，拿掉睡覺以後這兩個都沒有了（親近整晚照樣退）
enabled = true             # 關掉＝沒有掛念工具、沒有訊號、沒有走神／聯想、【狀況】沒有感覺那句。理由：實驗 runner 和不是在測這個的測試用；她自己的程序開著
order = ["stress", "closeness", "drive"]   # 好幾個同時超出時先冒哪個。理由：壓力（該做的）比想主人、想做自己的事急
