stress_rest = 0.1
stress_half_life_h = 4.0   # 理由：被糾正或失敗的緊繃幾個小時內退掉
stress_high = 0.5          # 超過＝緊繃（該做的事冒出來，【狀況】說「你現在有點緊繃」）。理由：一次糾正（0.5）就超過，兩件失敗（0.25×2）才超過，一件不會
closeness_rest = 0.0       # 親近（跟主人來回說話、被謝 ↑；幾小時內退；低＝主人的事冒出來）。理由：沒人說話就一路往下，「太久沒說話」才會出現
closeness_half_life_h = 4.0   # 理由：一晚的聊天（約 0.85）退到 0.2 要約 8 小時，主人整天沒說話時下午四點左右她才第一次找他。睡覺拿掉以後晚上也照樣退，早上主人第一句之前可能已經低於 closeness_low
closeness_low = 0.2        # 低於＝想主人。理由：同上
closeness_start = 0.6      # 第一次開機（沒有 signals.json）時的親近。理由：在範圍內，不會一開機就找主人；其他訊號從 rest 開始
item_done_drive = 0.1      # todo 一項完成。理由：三件完成約等於一次被誇
item_failed_stress = 0.25  # todo 一項失敗（程式另外記成一件掛念）。理由：兩件才超出，一件只是有點在意
tool_errors_stress = 0.05  # 工具連續失敗的第二次起每次。理由：小，連錯好幾次才會累積到
praise_drive = 0.2         # 主人明確誇她、謝她（她用 owner.feedback 照抄他那句）
praise_closeness = 0.15
praise_stress = -0.15      # 理由：被肯定會鬆一點，約抵掉一件失敗的一半多
correction_stress = 0.5    # 主人糾正她（owner.feedback）。理由：一次就超出範圍約 1.3 小時，感覺得到但不會拖一整天
owner_talk_closeness = 0.1   # 主人的每一句。理由：一晚十來句聊天就到頂；早上三句約 +0.3
deadline_stress = 0.15     # 一件有時間的掛念進到 near_hours 內，只加一次。理由：自己一件不會超出，加上一件失敗才會
concern_done_drive = 0.1   # 她用 concern.end 說一件掛念做完了。理由：跟 todo 完成一樣
near_hours = 3.0           # 有時間的掛念在這麼近的時候加一次壓力。理由：還來得及準備
calendar_concern_hours = 24.0   # 一天內有開始時間的行事曆（系統維護除外）程式記成掛念，時間過了自己結束。理由：「明天的事還沒準備」是隔天才會想到的距離
log_days = 7.0             # 訊號的變化紀錄和結束的掛念留幾天。理由：dashboard 看最近一天，留一週回頭查
max_open = 20              # 同時掛著最多幾件，再記就請她先結束做完或放下的。理由：走神一次只冒一件，太多會一直輪不到；20 件還列得完
maintenance_concerns_max = 3   # 系統維護從一天的對話最多記幾件掛念（2026-11-16）。理由：牙醫那晚值得跟進的約 1–2 件（看完牙之後的感覺、開會的壓力）；多過 3 件，走神一次只冒一件，會擠掉她自己記的；0＝不做這一項
association_similarity = 0.42   # 主人剛說的話／工具結果跟一件掛念的餘弦 ≥ 這個，那件附在這個回合（【聯想】）（2026-11-16；之前共用 [select] similarity 0.55，真的跑一次都沒附過）。理由（Tests/DollCoreTests/AssocMeasure.swift，128 對：60 對該附、68 對不該附，45 對取自 m6 真跑的主人原話和掛念、83 對照主人口吻手寫）：不該附的最高 0.398，該附的中位數 0.539；0.42 不該附 0/68、該附 49/60（0.55 只有 29/60；6 字以內的短句 0.42 是 20/29、0.55 是 10/29）。抓不到的是「早～」「剛到家」這種跟起床／到家掛念的（0.30–0.41），跟不該附的重疊，門檻再低就會亂附（0.35 不該附 6/68）

[goals]
# 她自己的方向（m6-drives phase 2，2026-11-16，主人設計；Goals.swift、dolldocs/goals.md）：想成為的樣子、三層的目標樹、做完的事的紀錄、好奇。跟著 [drives] enabled 開關（它們動的是動力和掛念）。沒有點數、薪水、額度：她看不到數字，只有【狀況】那句感覺
goals_open_max = 3         # 同時開著的目標（方向）最多幾個。理由：方向多了哪個都推不動；【狀況】每回合列目標名字，3 個約 30 token
subgoals_open_max = 3      # 一個目標下同時開著的子目標。理由：每個開著的子目標是一件程式記的掛念（下一步），3×3＝最多 9 件，max_open 20 還有空間給別的
steps_open_max = 6         # 一個子目標下還沒做的步驟。理由：一份 todo 清單的長度；再多就是還沒想清楚，該拆成另一個子目標
text_max_chars = 60        # 樹上一個節點的字數。理由：是個名字不是說明，會出現在掛念和【狀況】裡
step_drive = 0.05          # 做完一個步驟，動力的全額（下面 now_share 先給一部分）。理由：比 todo 一項（0.1）小，因為步驟本來就切得小；四五步才抵一次被誇
subgoal_drive = 0.15       # 做完一個子目標。理由：一個結果，比幾個步驟加起來多一點
goal_drive = 0.3           # 做完一個目標。理由：最大，但單獨一次不會超過 drive_high（rest 0.4 + 0.15 先給的 < 0.8）
list_drive = 0.1           # 主人交代、她列成 todo 做完的一整份清單（不是目標樹的）。理由：清單裡每一項已經各 +0.1（item_done_drive），整份做完再一點點
now_share = 0.5            # 做完當下先給全額的幾成，剩下的等評價：好＝補滿，不對＝連先給的都收回。理由：主人說好比自己覺得做完更算數，各一半
feedback_hours = 12.0      # owner.feedback 不指定紀錄時，記在這麼近的最新一筆上。理由：晚上做的事，主人隔天早上才說好
ideal_max_chars = 600      # 想成為的樣子最多幾字。理由：每個請求都在系統提示裡，600 字約 400–600 token；起點約 150 字
review = true              # 系統維護回顧一天、看想成為的樣子要不要改（review 這一項）。關掉＝不做這一項。理由：不是在測這個的 runner 和測試用
revise_min_days = 3.0      # 系統維護最多幾天提一次修改。理由：每天變的理想是雜訊；她自己用 ideal.revise 不受這個限制
review_chars = 6000        # 系統維護回顧時讀那天對話的最後幾個字。理由：跟 concerns 那一項同一個模型，夠看一天的重點，請求不會太大
curiosity_hours = 48.0     # 這麼久沒碰到新東西，閒著時冒一次「好一陣子沒碰到沒見過的東西」。理由：一天沒有很正常，兩天才算落差
novelty_drive = 0.08       # 碰到新東西（沒見過的 app、瀏覽器裡沒看過的網頁標題）動力加這麼多。理由：比 todo 一項小；好奇是推著走，不是獎勵
novelty_gap_min = 30.0     # 這段時間內新東西只加一次。理由：瀏覽一次會翻過好幾頁，不然一下子就頂到
seen_days = 90.0           # 看過的東西記多久；超過再看到又算新的。理由：三個月沒碰的東西，重新碰到也算新鮮
