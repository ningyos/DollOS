# 系統維護（2026-11-16，主人：「直接說是系統維護，進行期間跟睡著一下」；Maintenance.swift、dolldocs/maintenance.md）：每天一次，行事曆的「系統維護」到了，她手上沒事就開始（不給她回合）：整理記憶＋寫摘要，她不在；開始和結束都有【系統維護】通知。主人或開發者在維護中說話＝打斷，什麼都沒寫，她直接回
enabled = true            # 關掉＝沒有「系統維護」、不維護、【狀況】沒有今天的量和下次維護。理由：實驗 runner 和不是在測一天的測試用；她自己的程序開著
time = "03:00"            # 行事曆沒有「系統維護」時建的時間（每天）。理由：主人常聊到過了午夜，03:00 一般不會在聊到一半；離他早上還很遠
busy_limit_hours = 3.0    # 時間到了她手上的 todo 還在做（進行中或等待中），等這麼久還沒好，就在她這一回合結束後開始，todo 留著、結束後給她一個回合接著做。理由：晚上的一件事一般一小時內做完；三小時還在忙，不強制的話那天就整理不到
retry_idle_min = 30       # 被打斷以後，沒人跟她說話這麼久、她手上也沒事，就再做一次（到不了就等隔天的時間）。理由：半夜的短對話這時候已經結束；不重試的話這一天要拖到明天才整理，隔天的時間線變兩天份
notice_min = 10           # 開始前先告訴她、給她一個回合，這麼多分鐘後才開始（主人，2026-11-16：讓她知道即將開始）。0＝不通知、時間到了直接開始。理由：夠她把話說完、跟人說一聲、或把今天的維護往後移；又短到 03:00 還是 03:00

