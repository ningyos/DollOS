[llm]
base_url = "http://192.0.2.10:8080"
model = "qwen3.8-flash-next-iq3_s"
default_effort = "none"       # 決定（spec 3.1）：預設 none；她呼叫 think(medium) 調高一次（2026-11-15：high 拿掉了，模板把 high 那句寫在 prompt 最前面，每用一次整條時間線重讀兩次，30 題對答案也沒有比 medium 好）。現在每個回合都是做事的回合，這個值只在「沒有新事件」的回合用（目前不會發生）
task_turn_effort = "medium"  # 決定（2026-11-08）：做事的回合（含新主人事件、她的工具結果、watch 叫醒）用 medium。理由：none 時第 1 回合常只說一句就停（B 同一請求重送 5／8 有呼叫工具），medium 10/10；M2 medium 輪 C 有 2 次在工具結果回合（none）只說一句就停。她用 think 指定的仍優先
timeout_s = 300.0             # 初始值理由：high 一次約 1.5 分鐘（spec 3.1 量測 94–98 s），留一倍餘裕
max_tokens = 4096             # 初始值理由：一回合一個動作，回覆很少超過 1k token；4k 夠 high 的思考
# 她的工具用請求的 `tools` 送（2026-11-14 起，取代 system prompt 裡的工具段落），呼叫從回應的 `tool_calls` 拿；伺服器讀不出來、留在 content 裡的呼叫算失敗、她會看到結果。沒有重送：原本的 unterminated_retries 拿掉了（量測見 DEMO.md）

[core]
data_dir = "data"
pack = "character_packs/doll2/doll.toml"
# 佇列排進時間線的優先序，高→低（spec 3.1；主人說話、主人打字、開發者打字（dollctl chat）、行事曆的時間到了、watch 叫醒）
# 決定（主人，2026-11-12）：開發者打字預設排在主人打字下面
# calendar（2026-11-15）：人說的話之後、watch 之前。行事曆的開始時間是外面世界的事實（主人的約），watch 是她自己設來看畫面的，常常只是「沒變化／時間到」；同一批裡她先讀到約、再讀到畫面
# wander（m6-drives，2026-11-15）：她走神（閒著、某個訊號超出平常範圍時，程式讓一件掛念冒出來）排最後：有人說話、行事曆、watch 都比她自己想到的事先
priority = ["owner_voice", "owner_text", "developer_text", "calendar", "watch", "wander"]
mlx_cache_limit_mb = 256      # MLX 的 buffer cache 上限（整個 process 一個：記憶的 embedding 和她的聲音共用同一個 MLX）。初始值理由：voice-mlx 量測用 256 MB，串流 TTS 峰值 3.0 GB；0＝不留 cache
docs = "dolldocs"             # 她的 DollOS 文件（2026-11-14；2026-11-16 起在這台 Mac 上原地讀）：這個資料夾的 .md，她用 read_file 讀它的絕對路徑（系統提示裡寫著）；相對路徑從目前目錄算。資料夾裡沒有 README.md＝開機失敗

[context]
# 她的 context 多滿、快滿時怎麼辦（2026-11-14，主人）。【狀況】每回合寫「context：用了／上限（%）；其中做事的過程 N（截圖 M）」
limit = 60000                 # 【狀況】拿來比的上限（token）。初始值理由（主人）：60k；Strata 單一 slot 約 295 tok/s prefill，整段重讀約 3.4 分鐘，再大重讀就太久
warn_ratio = 0.85             # 用到這個比例【狀況】才多一行「快滿了」（之前不提）。初始值理由（主人）：85% 還留 9k，夠她做完手上這一步、寫進度
force_after_turns = 3         # 看到「快滿了」這麼多回合她都沒 todo.progress，程式自己收這一項。初始值理由（主人）：給她 3 回合把手上的步驟做完再收
force_keep_turns = 2          # 程式自己收的時候，留她最近這麼多回合原封不動（她還看得到現在的畫面）。初始值理由（主人）：最近 2 回合＝上一個動作和它的結果，夠她接著做
talk_share = 0.5              # 到 limit 的時候（最後一道，馬上做；主人，2026-11-15）程式把還在 request 裡最舊的這個比例（對話和做過的事）換成一段摘要【之前的對話】，摘要由另一個乾淨的請求寫；不會切進進行中的那一項，切在某人的一句話之前。初始值理由：一半；每收一次要多一個摘要請求、之後整段重讀，所以一次收多一點
talk_effort = "medium"        # 寫那段摘要的請求的 reasoning_effort。初始值理由：跟做事的回合一樣

[computer]
# 她的電腦就是這台 Mac（2026-11-16，主人）：在背景操作主人的 app，經過開源的 cua-driver（https://github.com/trycua/cua），不搶主人的滑鼠、鍵盤和前景 app。
# 開機時：cua-driver 不在、它沒有輔助使用／螢幕錄製權限＝開機失敗，訊息寫怎麼修；daemon 沒在跑就由 dollcore 啟動（cua-driver serve），結束時停掉它啟動的那個；已經在跑的照用、不停
driver = "/Applications/CuaDriver.app/Contents/MacOS/cua-driver"   # cua-driver 0.52.4 的 CLI（~/.local/bin/cua-driver 是指向它的連結；用絕對路徑，不靠 PATH）
daemon_start_s = 10.0         # dollcore 啟動的 daemon 最多等這麼久回應。初始值理由：2026-11-16 手動 cua-driver serve 不到 1 秒就在聽 socket；10 倍餘裕
max_elements = 250            # 讀一個視窗最多走這麼多個元素（cua-driver 自己的預設）。初始值理由：計算機 34 個、備忘錄、TextEdit 都在 250 內；超過時結果會說清單被截斷、要看截圖
screenshot_max_dimension = 1024   # 視窗截圖長邊最多這麼多像素。初始值理由：計算機視窗 460×816（2 倍）原樣就夠讀；大視窗（Safari、Finder）縮到 1024 長邊，小字仍讀得出來的程度未驗證
screenshot_tokens = 600       # 只用來估【狀況】的 context 長度：一張視窗截圖約多少 token。量測見 DEMO.md「電腦」
settle_s = 0.4                # 每個動作做完、重讀視窗之前等這麼久。初始值理由：cua-driver 自己的動作已等到 300 ms 看有沒有新視窗；多等 0.4 秒讓按下去的結果畫出來
read_batch = 4               # 最多這麼多次視窗讀取留著清單和截圖；再來一次，前面的每一次一起收成一行，只留最新的，再往下累積（2026-11-17）。理由：Strata 只能從之前某個請求的結尾接著讀，每回合收一次＝每回合從這一項第一次讀取重讀；成批收，中間的回合只讀新加的。4：25 回合的計算機估計重讀從約 10.7 萬降到約 5 萬 token（多留最多 3 次讀取，計算機約 3–4k token），8 只再省約 1 萬卻多留一倍。量測見 DEMO.md「電腦」和 experiments/m7-mac/cacheprobe
sequence_max_steps = 20      # 一次 act 最多幾步（2026-11-17）。理由：cua-driver 一批最多 64 步、整批最多 60 秒；一步約 0.5 秒，用名字找的元素最多等 3 秒；不看畫面連做太多步，走偏了也不知道
cursor_idle_hide_ms = 0       # 她的游標閒置多久會藏起來（毫秒，0＝永遠不藏；cua-driver 限 0–60000，預設 15000）。理由（2026-11-17，主人）：要隨時看得到她在哪裡；15 秒會在她大部分回合之間藏起來（她一回合 5–80 秒）
window_wait_tries = 5         # open／menu 之後最多看幾次 app 有沒有視窗，才說它沒有視窗
window_wait_s = 0.6           # 兩次之間等多久。初始值理由：2026-11-16 TextEdit 選「檔案 › 新增」後 1.5 秒內新視窗已在；5×0.6＝3 秒
auth_processes = ["SecurityAgent", "coreautha", "LocalAuthenticationRemoteService", "AuthenticationServicesAgent"]   # 系統驗證視窗（Touch ID、管理者密碼）的擁有者 process 名字：畫面上有它們的視窗，結果就多一行【系統驗證】要她停下來告訴主人。哪些名字在這台 Mac 上真的會出現，見 DEMO.md「電腦」的 g3 量測
decide_after_rounds = 15      # 一份 todo 清單（從 todo.set 起，所有項目加起來；2026-11-17 起，之前是每一項各算）進行了這麼多回合（她的一則回覆＝一回合），電腦和檔案工具先停：她要選「還缺什麼、最卡的一步、下一次哪裡不一樣」（todo.continue）、問主人（ask_owner）或 todo.fail。初始值理由：2026-11-16 m7-mac 真模型，做得成的中位 11–14 回合（備忘錄 7），做不到的一路跑到 runner 的 30 回合上限、從沒 todo.fail；15 讓多數做得成的不會碰到。改成整份清單算的理由：2026-11-17 x-3 她把一件做不到的事拆成兩項，每項重新數，決定點到第 26 回合才來（上限 30）
decide_every_rounds = 10      # 選了繼續（或問了主人、或在決定點完成了一項）以後，再過這麼多回合又要選一次。初始值理由：做得成的最長一次 20 回合（a-1），15＋10＝25 之內；做不到的 30 回合裡會被問 2 次
plan_min_chars = 4            # 2026-11-17：她寫的 todo.set 計畫（facts／assumptions／limits／check）、todo.continue 的 missing／stuck／change、todo.fail 的 cause，每欄至少這麼多個字母或數字（標點、空白不算），不然退回；limits 先拿掉「沒有」「無」「限制」「因為」「none」這類字（Doll.noLimitWords）再數，所以「沒有，因為…」要帶至少這麼多字的理由。理由：「沒有」「無」「同上」「N/A」都在 3 個以下；一句具體的中文事實至少 4 個字
estimate_similarity = 0.90    # 2026-11-18 估的回合由程式對（主人決定）：她開新清單時，程式找以前「像這次」的清單：這份清單回應的那句話（沒有就用她寫的項目），數字遮掉，跟以前的 cosine 至少這麼多才算像。理由（experiments/m7-mac/2026-11-18/estcheck，109 份清單、7 種、真的 Qwen3-Embedding）：不同種的最高 0.847（乘法 vs 乘法再乘 n.txt 的數），同一種最低 0.94（備忘錄）；只漏了「用你存的乘法工具算」對一般乘法（0.85），漏掉＝不比，不會退錯
estimate_similar_max = 3      # 像的清單取最近這麼多份，實際回合的中位數就是「以前做了多少」。理由：她用了工具以後會變快，只看最近的；中位數不讓一份特別慢的（同時存了工具）帶偏
estimate_far_ratio = 2.0      # 她估的跟以前的中位數，大的超過小的這麼多倍、而且差至少 estimate_far_rounds 回合，才算差太遠，退回一次。理由：回合數很小，只看倍數 2 對 3 也會退；只看差 3 回合，7 對 10 也會退。照以前的資料重跑（每個資料夾自己的歷史）：34 份有可比的，會退 5 份，其中 3 份真的估錯（est-1 合併檔估 2、實際 7–8），另 2 份是存了工具以後變快（她可以說理由過）
estimate_far_rounds = 3
own_tools_max = 30           # 2026-11-17：她自己的工具（存下來的一串動作，tool.save／tool.run）最多幾個；滿了 tool.save 退回，主人在 dashboard 刪掉用不到的。理由：主人決定的初始值（2026-11-17 決定 4）
own_tool_offer_similarity = 0.45  # 主人的話（加前景 app）跟一個工具（名字、什麼時候用、存它那次主人的話）的 cosine 至少這麼多，【相關記憶】就告訴她有這個工具。初始值理由（2026-11-17，Qwen3-Embedding，experiments/m7-mac/2026-11-17/tools/offer-cosine.txt）：「乘法」工具對三句新的乘法要求 0.454、0.481、0.568，對加法 0.493、除法 0.393、無關的話 0.15–0.29；「新備忘錄」工具對新增備忘錄 0.916，可是對「接三個檔」0.581、「在備忘錄找昨天那則」0.553 也過。0.45 接得到量過的每一個該提的，代價是偶爾多提一個不相干的工具（一個約 60–90 token，她看名字就知道不用）；0.6 一個乘法要求都接不到
own_tool_offer_max = 1       # 一次最多提幾個工具。理由（2026-11-18，experiments/m7-mac/2026-11-18/offer/rules.txt：6 個工具、30 句主人的話、真的 Qwen3-Embedding）：17 句該提的，最相近的都是對的那個（17/17）；第二個從來不是對的，只是同類的（乘法的要求提加法）。2 個時不該提的多提 14 次，1 個時 6 次，漏掉的都是 0
own_tool_retire_failures = 3 # 一個工具連續失敗這麼多次，就不再提、也不能用（不刪，dashboard 看得到）。理由：一次失敗可能是畫面剛好不對；連三次多半是 app 改了、工具不再對（2026-11-17 決定 3）

[files]
# 檔案工具（2026-11-09；2026-11-16 起讀寫這台 Mac 的檔案）：read_file／write_file／edit_file 直接讀寫文字檔，不經過 GUI；~ 是主人的家目錄
max_read_lines = 500          # read_file 一次最多回這麼多行，剩下只說「還有 N 行」。初始值理由：一行約 10–40 token，500 行最多約 2 萬 token，一次讀完一般文字檔又不會把 context 塞滿

[idle]
# 連續 N 輪沒工具呼叫＝空轉，寫一行 log（spec 3.8；不通知、不限速）。選單開著時，前 N-1 輪程式回【提醒】再叫她一次（2026-11-11）
max_turns_without_tool = 3    # 初始值理由：r5 失敗樣本是連續 3 輪只寫標記不動手；2 輪可能只是回話

[memory]
# M3a：markdown 是原始資料（spec 6），SQLite 只當可重建索引
dir = "memory"
secret_dir = "secret"         # 主人的秘密，只進對主人的回合（spec 5.1）
own_dir = "own"              # 她自己的秘密（密碼、token）：主人的回合和她自己做事的回合看得到，陌生人的回合看不到（spec 6，2026-11-08）
public_dir = "public"
registry_dir = "entities"     # 實體登記簿（2026-11-11）：記憶提到的每個具體東西一個檔（正式名字、別名、說明），是原始資料；SQLite 裡的是可重建索引
rrf_k = 60                    # 初始值理由：RRF 原始論文的建議常數；k 大讓單一條列表的第 1 名不會壓死另一條列表
max_candidates = 50           # 初始值理由：每條列表取 50，2 萬條以內記憶體裡算 cosine 不到 0.1 秒（30 條實測 <1 ms）
confidence_weight = 0.01      # 初始值理由：RRF 分數約 0.003–0.033（k=60）；0.01×confidence 讓確信度能翻掉名次差一两名、不會蓋過排序本身
today_confidence = 0.9       # 決定（2026-11-10）：recall 也查今天的時間線，今天的一條在融合分數裡用這個值代替 confidence（一樣乘 confidence_weight）。初始值理由：時間線是當時的原文紀錄（主人的話、她的話、工具結果），跟主人的原話（0.9）一樣可信
high_confidence = 0.70        # ≥ 講「確定」：主人的原話或工具輸出（0.9）過，她自己猜的（0.3）不過
medium_confidence = 0.40      # ≥ 講「大概」，不然「聽說」；0.4 卡在陌生人轉述（0.5）之下界附近，M6 再調
confidence_owner = 0.9        # 主人的原話：最可信，但不是 1.0（她可能講錯、之後改）
confidence_developer = 0.8    # 開發者在 dollctl chat 講的（2026-11-12）：做這套程式的人，可信，但不是主人的原話（0.9）
confidence_tool = 0.85        # 命令／job 的輸出：事實但可能是錯的命令產的
confidence_stranger = 0.5     # 陌生人講的（M6 才有這種輸入）：一面之詞
confidence_doll = 0.3         # 她自己的推測：最弱，要查證才講
confidence_program = 0.95     # 程式直接讀到的事實（選單上的快捷鍵）：沒經過模型判斷，比工具輸出（0.85）高；不是 1.0，app 自己的選單也可能不準
confidence_self_reported = 0.4   # 經驗（2026-11-09）：她自己說這次達成了，程式才把這次的動作存下來；成功只是她的自評、沒有外部檢查，所以落在「大概」的下緣
confidence_consolidated = 0.6   # 整理寫的記憶（2026-11-11）：另一個模型讀當天時間線的原文寫的，有來源可查（比她自評的經驗 0.4 高），但經過模型的摘要、沒有外部檢查（比工具輸出 0.85 低）；落在「大概」
embedding_model = "Qwen/Qwen3-Embedding-0.6B"   # 決定（主人，2026-11-11）：記憶的 embedding 換成 Qwen3-Embedding-0.6B，在 Swift 裡用 MLX 跑（MLXEmbedders）。Hugging Face id（第一次下載到 ~/.cache/huggingface/hub，之後讀快取）或模型資料夾的絕對路徑。載不起來＝開機失敗，沒有退路。理由（fmscore，4 個情境 20 條）：舊的 NLContextualEmbedding 分數跟著文字系統和符號走、不是意思，無關的 Safari 情境最高 0.887 比相關的平均（0.82–0.85）還高；Qwen3 無關的最高 0.47、相關的平均 0.61–0.73
embedding_query_instruction = "Given a web search query, retrieve relevant passages that answer the query"   # 查詢前面加「Instruct: <這個>\nQuery:」（模型卡的格式），記憶、登記簿條目、今天的事件不加。初始值理由：sentence-transformers 的 query prompt，fmscore 量的就是這個
embedding_max_tokens = 2048  # 一段文字超過這麼多 token 只取前面這麼多再 embed。初始值理由：記憶最多 experience_max_chars 字（中文約一字一 token），今天的工具結果可能很長；長度越長越慢（注意力是平方）
max_query_phrases = 16        # 初始值理由：中文查句切三連字窗，30 字以內的句子不會超過 28 個；16 個已經蓋住整句，再多重複字不增加命中
experience_max_chars = 800   # 一條經驗最多幾個字（超過從中間的步驟砍起）。初始值理由：E 一次 9–16 個動作、一步約 30–50 字，800 字蓋得住；中文約一字一 token，附一次不到兩張截圖的量
experience_group_similarity = 0.9   # 主人那句話的 embedding 相似度 ≥ 這個＝同一個目標，一組只附成績最好的一條（2026-11-09）。理由（2026-11-11 換 Qwen3-Embedding 後實測，兩邊都當文件、不加 instruction）：E 跟改寫過的 E 0.977，E 跟 F（也是 notes.txt＋TextEdit）0.780，其他任務兩兩 0.31–0.75；0.9 在 0.78 和 0.977 中間（舊模型時是 0.97：E/E' 0.984、E/F 0.940）
experience_follow_ratio = 0.5        # 附上的經驗有這麼多比例的步驟依序出現在她這次的動作裡＝照做了，照做才記成功／失敗。初始值理由：Experience2 P 對上 4–10 步，一半以上算照做
# 記憶的強度（2026-11-15，主人 2026-11-05/07、11-14 定的；experiments/m6-memory-strength/simulate.py）：ACT-R 的 base-level activation，B＝ln Σ (1 + 第 k 次證據到現在的時間/strength_unit_days)^-strength_decay。證據＝不同日子、不同事件又顯示同一件事（睡覺整理的 confirm 認定，一天最多一次；她自己重說、recall、自動附都不算），第一次是寫下的那天。只影響自動附（【相關記憶】），recall 不管強度；內容永遠不變。只有她、主人、開發者、工具、整理寫的記憶有強度；快捷鍵和經驗沒有（各有自己的規則）。沒有這三行的舊設定照下面的值開機
strength_decay = 0.5           # d。理由：ACT-R 的教科書值；模擬（simulate_results.txt）在 unit 7 天時給出主人要的行為（見下面兩行）
strength_unit_days = 7.0       # 時間的單位（天），證據那天算 1、一個單位後算 2^-d。理由：一天當單位時，兩天連續看到（第 1 天 0.53）比一週一次看到三次（第 14 天 0.48）還強，沒有一條線能讓「兩週內三個不同的日子」記牢又不讓「連續兩天」記牢；七天時三次一週一次 0.83、連續兩天 0.66，分得開
strength_settled = 0.75        # 記牢的線：證據剛加上時 B ≥ 這個就記牢，之後永遠不淡（存在檔案裡的 settled_ts，改設定也不會變回來）。理由：n 次證據最多 ln n，ln 2＝0.69 < 0.75 < ln 3＝1.10，所以至少要三個不同的日子；第 0、7、14 天（0.83）和第 0、10、20 天（0.77）記牢，第 0、14、28 天（0.71）、第 0、30、60 天（0.56）不會；3 個月內 6 次（每 18 天）在第 4 次（第 54 天）記牢

[dashboard]
# 後台網頁（2026-11-09）：dollcore 自己提供，唯讀看她的視覺、記憶、動作，只有「中斷」和「暫停／繼續」兩個系統操作
enabled = true
port = 8790                   # 初始值理由：跟 Strata 的 8080、舊 MCP server 的埠都不撞；只要沒被占用都可以
bind = "127.0.0.1"            # 只給本機看：頁面上有主人的秘密（secret）和她的密碼（own）；要從別台看就自己改，風險自負
timeline_items = 200          # 時間線一次只回最新這麼多項（一個回合、主人一句、一次 watch、一則程式事件各算一項）。初始值理由：一個任務 10–30 回合、每回合 1–5 項，200 項蓋得住最近幾個任務；時間線檔留著全部，不限的話每次更新都要傳越來越大的 JSON

[api]
# 本機 API（2026-11-12）：dollctl（開發者）和 Discord bridge（主人）連這裡。只聽 127.0.0.1、不是本機連進來的直接斷掉，不能改；主人的路由要 dollcore 每次開機隨機產生、只交給 bridge 的金鑰
port = 8791                   # 初始值理由：dashboard 8790 的下一個；只要沒被占用都可以

[bridge]
# Discord bridge（2026-11-12）：dollcore 開機時啟動、看著它。只轉主人的私訊；她用 discord.dm 傳的話回到主人的私訊
enabled = false               # 決定：範例預設關，先照 DEMO.md 放好 bridge/discord.toml（token、主人的 Discord user ID）再改 true；開著但起不來＝開機失敗
command = ["~/.local/bin/uv", "run", "--quiet", "--frozen", "--project", "bridge", "python", "-m", "dollbridge", "--config", "bridge/discord.toml"]   # 從目前目錄跑；dollcore 另外給 DOLL_API 和 DOLL_BRIDGE_TOKEN 兩個環境變數
ready_timeout_s = 60.0        # bridge 連上 Discord、開好主人的串流要在這麼多秒內。初始值理由：登入加 on_ready 一般幾秒；第一次 uv 要建 venv，留餘裕

[consolidate]
# 整理（2026-11-11）：每天的系統維護裡做（[maintenance]）；她的程序沒開的時候也可以手動（dollcore --config … consolidate <data_dir>）。另開一個乾淨的請求（沒有人設、不在她的 context 裡）把時間線整理成長期記憶，再開新的 segment
effort = "high"               # 決定（主人，2026-11-11）：整理用 high
max_tokens = 16384            # 初始值理由：high 的思考加上操作清單；一天幾個任務的操作清單約 1–3k token，思考留大部分
timeout_s = 900.0             # 初始值理由：high 一次約 1.5 分鐘（spec 3.1），整理的輸入是整天的文字、輸出也較長，留足餘裕
recall_k = 8                  # 每個任務、每個查詢（主人那句、她的 outcome summary）找幾條相關的既有記憶給整理看。初始值理由：比舊的 recall top_k（5）多一點，讓合併／取代看得到同類的；去重後通常十幾條
registry_k = 10               # 每個任務、每個查詢再給整理看幾條登記簿裡相近的條目（另外加上給看的記憶提到的條目），讓它把實體對到既有條目。初始值理由：一個任務提到的具體東西通常 5–10 個（app、檔案、資料夾、快捷鍵、對話框）
retired_keep_days = 30        # 決定（主人，2026-11-11）：被取代的記憶檔留這麼多天，之後的整理才刪

[select]
# 選記憶（2026-11-11 登記簿；2026-11-15 拿掉本機模型逐條打分，experiments/m6-select-eval；同日整個拿掉本機模型，experiments/m6-registry-eval、m6-drop-fm）：【相關記憶】和 recall 走同一條路，不從任何句子抽名字：找出所有相關的（FTS 命中＋查詢裡兩個字的詞直接比對、embedding、帶前景 app 登記簿條目的記憶（程式用 bundle id 確定知道的，只在自動附）、跟 FTS/embedding 命中的記憶共用一個登記簿實體的一跳）→ 自動附：餘弦 ≥ similarity 的照便宜分數最多 attach_max 條；recall：融合排名（文字命中、餘弦兩個名次的 RRF）前 recall_limit 條，不設門檻。不需要 Apple Intelligence
similarity = 0.55             # 自動附的門檻（也是自動附的 embedding 頻道）：跟查詢的餘弦 ≥ 這個才附；只靠 FTS／實體／一跳找到、餘弦不到的不附。理由（attach_rule.py，20 條×16 情境）：用實體補進門檻下的（便宜分數 ≥0.55）16 個情境多出 46 條、只有 5 條相關，前 5 條變差（必要 14/19、有幫助 10/21、不相關 2.6；不補 15/19、11/21、2.1）；無關的情境（Safari、聊天）最高 0.42–0.46，全部 0 條；≥0.6 必要的一樣多、有幫助的少（見 attach_max）
entity_weight = 0.2           # 便宜分數＝跟查詢的餘弦＋這個（它帶前景 app 的登記簿條目時），只決定門檻以上的排序。理由：上面那種餘弦的雜訊幅度約 0.1–0.3，帶前景 app 加 0.2 才排得過大部分雜訊；拿掉名字抽取後（m6-drop-fm）前景 app 是唯一的觸發實體
attach_max = 5                # 自動附最多幾條。理由（attach_rule.py，從實測的餘弦重算）：≥0.55 前 5 條＝必要 15/19、有幫助 11/21、每次 4.1 條其中不相關 2.1，跟之前（前 8 條→本機模型 ≥7：15/19、11/21、3.8／1.8）一樣好，省掉每句約 4 秒；前 3 條 13/19、9/21、2.8／1.1；≥0.6 不限 15/19、9/21、3.8／1.9。只算自動附真的會找的 8 條經驗／整理過的記憶：前 5 條 10/10、10/12、3.5／1.9（之前 10/10、11/12、3.5／1.8）
recall_limit = 3              # recall 回幾條。決定（主人，2026-11-15）：3。理由（results-after.txt，一天 16 件事、32 個有答案的查詢）：前 3 條拿到正確那句 31/32，跟前 5 條一樣，不相關的每次 3.3→1.3 條；之前 18/32 進候選、本機模型 ≥7 只給 2/32。真的一天幾百行時夠不夠沒量過，漏了再調
recall_candidates = 5         # recall 的 embedding 頻道：餘弦最高的這麼多條當候選，不設門檻（上面的 31/32 是用 5 量的）；要 ≥ recall_limit
strength_floor = -0.75         # 淡了的線：會淡的記憶（不是 deep、還沒記牢）強度低於這個就不自動附（recall 照樣找得到）。理由（simulate_results.txt，d 0.5、unit 7 天）：只看到一次的附到第 24 天（三個多禮拜）；兩個不同日子（第 0、1 或 0、3 天）附到第 118–120 天；第 0、14、28 天附到第 289 天；第 0、30、60 天附到第 306 天。最近幾天的強度在 0 到 -0.18 之間（第 3 天），遠在線上，跟以前一樣附
strength_weight = 0.1          # 便宜分數再加這個 × 強度（強度低於 0 時；deep、記牢的、經驗加 0）：淡的排後面。理由：小到不改變新的記憶的排序（第 3 天最多 -0.018，比 entity_weight 0.2 和餘弦雜訊 0.1–0.3 小很多），快淡掉的（-0.7）少 0.07，跟它同分附近的新記憶排在它前面

[voice]
# M6 語音（2026-11-13）：她自己決定進不進主人在的 Discord 語音頻道（voice.join／voice.leave）；bridge 從 /api/voice 把主人的聲音送來（Apple SpeechTranscriber 聽），她的 voice.say 在語音頻道裡用 Qwen3-TTS 0.6B（voice-mlx，同一個 process）念出來
enabled = false               # 範例預設關；開著時開機要載 TTS、編好參考聲音、熱身一句，載不起來＝開機失敗
asr_locale = "zh-TW"          # SpeechTranscriber 的語言（資產要裝好；系統提供下載時開機會裝）
silence_ms = 700              # 主人停了這麼多毫秒＝一句話說完，呼叫 finalize(through: 最後有聲音的地方)。初始值理由：SpeechTranscriber 自己的 final 約 12 秒一次、不看停頓；/tmp/asrlat 量 finalize 後約 30 ms 出 final
silence_rms = 300.0           # 一個 16-bit 音框的 RMS 低於這個算沒聲音（按著 push-to-talk 但沒說話）。初始值理由：Discord 的靜音框是 0；講話一般上千
endpoint_poll_ms = 20         # 多久檢查一次停頓的時鐘。初始值理由：bridge 一個音框 20 ms
asr_final_timeout_ms = 1500   # finalize 之後等 final 最多這麼久；沒等到＝這段沒有字。初始值理由：量到的約 30 ms，留很大餘裕
tts_model = "aufklarer/Qwen3-TTS-12Hz-0.6B-Base-MLX-8bit"   # Hugging Face id（快取在 ~/Library/Caches/qwen3-speech）或資料夾絕對路徑；之後換成夜間微調的 bundle
tts_codec = "Qwen/Qwen3-TTS-Tokenizer-12Hz"
tts_precision = "int8"        # 決定（主人）：8-bit；bf16 要未量化的 bundle
reference_audio = "character_packs/doll/voice/qwen3/ref_plus_zh.wav"   # ICL 參考聲音（相對目前目錄或絕對路徑）；開機編一次
reference_text = "character_packs/doll/voice/qwen3/ref_plus_zh.txt"    # 參考聲音的逐字稿
tts_language = "detect"       # 每句給 TTS 的語言：detect＝有假名 ja、有漢字 zh、有英文字母 en、其他 auto；或固定一個 voice-mlx 收的代碼
warmup_text = "嗯。"          # 開機念一次（丟掉）：編譯 talker、用參考聲音種好串流解碼器的狀態，第一句真的話就不用付這些
sentence_max_chars = 60       # voice.say 切成句子（。！？；… 換行，小數點不切），一句超過這麼多字再從逗號切。初始值理由：一句越長，主人打斷時「大約說到哪」越不準；60 字約 10 秒
data_dir = "voice"            # 每一句念過的話（24 kHz wav＋manifest.jsonl 一行：文字、語言、seed、時間、有沒有被打斷），給夜間微調；在 [core] data_dir 底下，除非是絕對路徑
stop_settle_ms = 150          # 送出 stop 之後，再收這麼久的 played 才算最後播到哪。初始值理由：bridge 每 ≤100 ms 回報一次
bridge_timeout_s = 10.0       # bridge 這麼久沒回 joined／left 或播放進度＝錯誤。初始值理由：進語音頻道一般 1–2 秒
bridge_probe_ms = 1000        # 已經有一條 /api/voice 時又來一條（bridge 重連）：舊的先收一個 ping，這麼久沒有任何回應＝半開的死連線，關掉、換新的上；有回應＝新的那條 409。初始值理由：本機上活的 bridge 幾 ms 就回 pong

[calendar]
# 她的行事曆（2026-11-15）：<data_dir>/calendar.json；有開始時間的事，時間到了給她一個回合
status_items = 5      # 【狀況】最多列今天幾件，多的說「還有 N 件」。理由：【狀況】每回合都送，長的一天不能讓它一直長；5 件夠一般的一天
list_max_days = 31    # calendar.list 一次最多幾天。理由：結果會留在她的 context；最長的問法是「這個月」

