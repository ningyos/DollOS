[llm]
base_url = "http://192.0.2.11:8080"
model = "qwen3.8-flash-next-iq3_s"
default_effort = "none"       # 決定（spec 3.1）：預設 none；她呼叫 think(medium／high) 調高一次。現在每個回合都是做事的回合，這個值只在「沒有新事件」的回合用（目前不會發生）
task_turn_effort = "medium"  # 決定（2026-11-08）：做事的回合（含新主人事件、她的工具結果、watch 叫醒）用 medium。理由：none 時第 1 回合常只說一句就停（B 同一請求重送 5／8 有呼叫工具），medium 10/10；M2 medium 輪 C 有 2 次在工具結果回合（none）只說一句就停。她用 think 指定的仍優先
timeout_s = 300.0             # 初始值理由：high 一次約 1.5 分鐘（spec 3.1 量測 94–98 s），留一倍餘裕
max_tokens = 4096             # 初始值理由：一回合一個動作，回覆很少超過 1k token；4k 夠 high 的思考

[core]
data_dir = "data"
pack = "character_packs/doll2/doll.toml"
# 佇列排進時間線的優先序，高→低（spec 3.1；M2 的三種來源：主人說話、主人打字、watch 叫醒）
priority = ["owner_voice", "owner_text", "watch"]

[computer]
# M2：她的電腦＝VMPal 的 VM，只看截圖、用滑鼠鍵盤操作（spec 3.1，2026-11-08）
vm_id = "E6813EBA"            # Doll VM；用 ID 不用名字：vmpal ui 不用回頭問 VMPal
vmpal = "/Applications/VMPal.app/Contents/Helpers/VMPalMachine.app/Contents/MacOS/VMPalMachine"   # PATH 上沒有 vmpal
agent_desktop = "/Users/doll/agent-desktop/agent-desktop"   # VM 裡的 agent-desktop（v1.2.0）；每個動作後用 vmpal exec 跑 snapshot --skeleton -i --compact，附最前面視窗的概要（2026-11-08 決定：截圖＋一部分的 tree）
screenshot_width = 1280       # 初始值理由：VMPal 的座標空間本來就是 1280 寬，截圖同寬她的座標不用換算；一張約 350 token（spec 3.x 探測）
screenshot_format = "jpeg"    # 初始值理由：VMPal 預設；1280 寬一張約 270 KB，PNG 大好幾倍，每回合都要重送
screenshot_tokens = 350       # 只用來估【狀況】的 context 長度；1356×737 探測一張約 350 token
watch_poll_s = 1.0            # 初始值理由：一次區域截圖約 0.05 秒；每秒比一次夠快，又不佔 VM
watch_min_interval_s = 10.0   # 初始值理由：兩次叫醒至少隔 10 秒，大約一次模型呼叫的時間；一直變的畫面不會每秒叫她（主人選限頻）
watch_stop_after = 3          # 初始值理由：連 3 次叫醒都沒動作＝她不在看這塊；再叫只是燒回合
watch_default_max_wait_s = 120.0   # 初始值理由：她沒說最多等多久時等 2 分鐘；一般 app 開啟、網頁載入、短命令都在這之內

[idle]
# 連續 N 輪沒工具呼叫＝空轉，只寫 log（spec 3.8；不通知、不限速）
max_turns_without_tool = 3    # 初始值理由：r5 失敗樣本是連續 3 輪只寫標記不動手；2 輪可能只是回話

[memory]
# M3a：markdown 是原始資料（spec 6），SQLite 只當可重建索引
dir = "memory"
secret_dir = "secret"         # 主人的秘密，只進對主人的回合（spec 5.1）
own_dir = "own"              # 她自己的秘密（密碼、token）：主人的回合和她自己做事的回合看得到，陌生人的回合看不到（spec 6，2026-11-08）
public_dir = "public"
top_k = 5                     # 初始值理由：一次 recall 讀 5 條約 200–400 token；再多每回合重讀太貴，也稀釋她的注意力
rrf_k = 60                    # 初始值理由：RRF 原始論文的建議常數；k 大讓單一條列表的第 1 名不會壓死另一條列表
max_candidates = 50           # 初始值理由：每條列表取 50，2 萬條以內記憶體裡算 cosine 不到 0.1 秒（30 條實測 <1 ms）
confidence_weight = 0.01      # 初始值理由：RRF 分數約 0.003–0.033（k=60）；0.01×confidence 讓確信度能翻掉名次差一两名、不會蓋過排序本身
high_confidence = 0.70        # ≥ 講「確定」：主人的原話或工具輸出（0.9）過，她自己猜的（0.3）不過
medium_confidence = 0.40      # ≥ 講「大概」，不然「聽說」；0.4 卡在陌生人轉述（0.5）之下界附近，M6 再調
confidence_owner = 0.9        # 主人的原話：最可信，但不是 1.0（她可能講錯、之後改）
confidence_tool = 0.85        # 命令／job 的輸出：事實但可能是錯的命令產的
confidence_stranger = 0.5     # 陌生人講的（M6 才有這種輸入）：一面之詞
confidence_doll = 0.3         # 她自己的推測：最弱，要查證才講
language = "zh-Hant"          # NLContextualEmbedding 的語言；zh-Hans／zh-Hant 在本機是同一個模型（實測同一 modelIdentifier）
max_query_phrases = 16        # 初始值理由：中文查句切三連字窗，30 字以內的句子不會超過 28 個；16 個已經蓋住整句，再多重複字不增加命中
