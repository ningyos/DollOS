[project]
name = "dollbridge"
version = "0.1.0"
description = "Discord bridge for dollcore: the owner's DMs and voice in, her say and voice out"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned to the PR #3159 commit (fix/voice-rec-2, "DAVE Support (rec)") that the 2026-11-06 voice
    # spike ran as 2.8.2.dev91+g10a5e8cf1 on macOS 27 (DAVE voice receive). Move the pin only
    # together with davey and a live voice test.
    "py-cord[voice]",
    # The PR is written against davey 0.1.x: with 0.2.0 `dave.ready` stays False (0.2.0 needs an
    # extra `prepare_transition` after a commit) and every received packet decodes to noise.
    "davey==0.1.7",
    "numpy>=2.0",   # resampling (48 kHz stereo <-> 16/24 kHz mono)
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
py-cord = { git = "https://github.com/Pycord-Development/pycord", rev = "10a5e8cf13bd8db21f95baf62cf866056d1e1091" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dollbridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
